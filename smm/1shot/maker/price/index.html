 c.font=`700 ${size}px RSN`;c.fillText(v,xx,y);xx+=c.measureText(v).width+size*.06;c.font=`800 ${size*.78}px UB`;c.fillText('₽',xx,y);xx+=c.measureText('₽').width;

const B={
 logo:{h:()=>125,draw(c,b){if(IMG.logo)c.drawImage(IMG.logo,X0,0,340,340*138/522);

  c.lineWidth=2;c.strokeStyle=it.hl?'#E93E97':'#26262b';c.strokeRect(x+1,1,w-2,120);

  c.font='400 16px UB';c.fillStyle='#9a9a9a';c.textAlign='right';c.fillText(b.s1,P1,80);c.fillText(b.s2,P2,80);c.textAlign='left';

   else{const hh=r.k==='m'?84:88;y+=10;if(r.k==='m'){c.fillStyle='#7B3FD6';c.fillRect(L,y,R-L,hh)}else{const g=c.createLinearGradient(L,0,R,0);g.addColorStop(0,'#3a1d68');g.addColorStop(1,'#2a1450');c.fillStyle=g;c.fillRect(L,y,R-L,hh);c.strokeStyle='#6c3cc8';c.lineWidth=2;c.strokeRect(L+1,y+1,R-L-2,hh-2)}
    smallIcon(c,r.k,110,y+hh/2-15);c.fillStyle='#fff';c.font='400 30px UB';const two=!!r.s;c.fillText(r.n,154,y+(two?40:hh/2+11));if(two){c.fillStyle='#d9d0ff';c.font='400 18px UB';c.fillText(r.s,154,y+68)}

 plate:{h:()=>104,draw(c,b,k){c.fillStyle='#fff';c.fillRect(X0,0,CW,104);icon(c,b.ic,106,22,60,'#000');c.fillStyle='#000';c.font='700 36px RSN';spaced(c,String(b.title||''),192,52,2);

 band:{h:()=>84,draw(c,b){const col=COL[b.c]?.[0]||'#A3FF10';c.fillStyle=col;c.fillRect(X0,0,CW,84);c.fillStyle=b.c==='blue'?'#fff':'#000';
  let s=36;c.font=`800 ${s}px UB`;while(c.measureText(b.text).width>CW-60&&s>20){s-=2;c.font=`800 ${s}px UB`}c.textAlign='center';c.fillText(b.text,X0+CW/2,42+s*.36);c.textAlign='left'}},

   if(L.img){const ih=286,iw=ih*IMG.can.width/IMG.can.height,cx=X0+3+70+iw/2,cy=h-3+12-ih/2;c.save();c.translate(cx,cy);c.rotate(-9*Math.PI/180);
    c.shadowColor='rgba(0,0,0,.7)';c.shadowBlur=30;c.shadowOffsetY=18;c.drawImage(IMG.can,-iw/2,-ih/2,iw,ih);c.shadowColor=`rgba(${rgb},.35)`;c.shadowOffsetY=0;c.drawImage(IMG.can,-iw/2,-ih/2,iw,ih);c.restore()}}},
 qr:{h:()=>338,draw(c,b){const x1=242,x2=622;glowRect(c,x1,0,270,270,'rgba(163,255,16,.3)',50,'#fff');if(IMG.q1)c.drawImage(IMG.q1,x1+20,20,230,230);
  c.fillStyle='#fff';c.font='900 32px UB';c.textAlign='center';c.fillText(b.l1||'',x1+135,332);
  c.fillStyle='#A3FF10';c.fillText(b.l2||'',x2+108,28);c.textAlign='left';
  c.save();c.shadowColor='rgba(163,255,16,.35)';c.shadowBlur=40;rr(c,x2,54,216,216,24);c.fillStyle='#A3FF10';c.fill();c.restore();if(IMG.q2)c.drawImage(IMG.q2,x2+16,70,184,184)}}};
function hexRgb(h){const n=parseInt(h.slice(1),16);return `${n>>16&255},${n>>8&255},${n&255}`}

// ---------- layout ----------
function layout(){const vis=cfg.blocks.filter(b=>b.on);const qr=vis.find(b=>b.t==='qr');const rest=vis.filter(b=>b.t!=='qr');
 let y=TOP;const out=[];rest.forEach((b,i)=>{const o=B[b.t].over?.(b)||0;if(i)y+=GAP+o;const h=B[b.t].h(b);out.push({b,y,h});y+=h});
 let over=false;if(qr){const qy=H-TOP-B.qr.h(qr);over=y+GAP>qy;out.push({b:qr,y:qy,h:B.qr.h(qr)})}else over=y>H-TOP;
 return {items:out,over}}

// ---------- background ----------
let shapeC=null;
function background(c,t){c.fillStyle='#050507';c.fillRect(0,0,W,H);c.fillStyle='rgba(255,255,255,.045)';for(let x=0;x<W;x+=72)c.fillRect(x,0,1.5,H);for(let y=0;y<H;y+=72)c.fillRect(0,y,W,1.5);
 c.save();c.translate(540,1920);c.scale(1,768/756);let g=c.createRadialGradient(0,0,0,0,0,756);g.addColorStop(0,'rgba(233,62,151,.22)');g.addColorStop(.7,'rgba(233,62,151,0)');c.fillStyle=g;c.fillRect(-540,-1920*756/768,W,H*756/768);c.restore();
 c.save();c.translate(216,0);c.scale(1,576/648);g=c.createRadialGradient(0,0,0,0,0,648);g.addColorStop(0,'rgba(163,255,16,.08)');g.addColorStop(1,'rgba(163,255,16,0)');c.fillStyle=g;c.fillRect(-216,-10,W,H);c.restore();
 const p=t/8*2*Math.PI;c.lineWidth=2;
 for(let k=0;k<22;k++){const a=30+k*1.5,y0=1360+170+k*13;c.beginPath();for(let x=0;x<=1080;x+=20){const y=y0+a*Math.sin(x/170+p+k*.18)+18*Math.sin(x/90-p*2+k*.3);x?c.lineTo(x,y):c.moveTo(x,y)}
  c.strokeStyle=`rgba(233,62,151,${(.15+.5*(1-k/22)).toFixed(2)})`;c.stroke()}
 if(shapeC){c.save();c.globalAlpha=.75;c.translate(570+380,-210+380);c.rotate(Math.sin(p)*8*Math.PI/180);const s=1+.04*Math.sin(p*2);c.scale(s,s);c.drawImage(shapeC,-380,-380,760,760);c.restore()}}

// ---------- cached block bitmaps (with room for glows and the can sticking out) ----------
const PAD=70;let cache=new Map(),cacheKey='';
function bitmap(it,k=1){const key=JSON.stringify(it.b)+'|'+it.h;if(k>=1&&cache.has(key))return cache.get(key);
 const c=mk(W,it.h+PAD*2).getContext('2d');c.translate(0,PAD);c.textBaseline='alphabetic';B[it.b.t].draw(c,it.b,k);if(k>=1)cache.set(key,c.canvas);return c.canvas}

// ---------- frame: t = seconds since the animation started (Infinity = static picture) ----------
const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
function frame(t,tb=t){const L=layout();ctx.globalAlpha=1;background(ctx,isFinite(tb)?tb:0);
 const a=isFinite(t)?cfg.anim:'none';
 L.items.forEach((it,i)=>{const d=.35+i*.22,e=a==='none'?1:ease((t-d)/.7);if(e<=0)return;
  const k=a==='count'?ease((t-d)/1.2):1;const bm=bitmap(it,k);
  ctx.save();ctx.globalAlpha=e;let dy=a==='rise'||a==='count'?(1-e)*60:0;
  if(it.b.t==='logo'&&a!=='none'){ctx.beginPath();ctx.rect(0,0,X0+(W-X0)*e,H);ctx.clip()}
  if(it.b.t==='table'&&a!=='none'){ctx.beginPath();ctx.rect(0,it.y-PAD,W,PAD+it.h*e+(e>=1?PAD:0));ctx.clip();dy=0}
  ctx.drawImage(bm,0,it.y-PAD+dy);ctx.restore()});
 return L}
function introLen(){return .35+cfg.blocks.filter(b=>b.on).length*.22+1.3}

// ---------- preview ----------
const prev=document.getElementById(SCREEN?'scr':'prev');prev.appendChild(cv);
let playing=0,raf=0;
function still(){cancelAnimationFrame(raf);playing=0;const L=frame(Infinity);document.getElementById('warn').classList.toggle('on',L.over);setPlay()}
function play(loop=false){cancelAnimationFrame(raf);const t0=performance.now();playing=1;setPlay();
 const step=now=>{const t=(now-t0)/1000;frame(t);if(!loop&&t>introLen()+.3){still();return}raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)}
function setPlay(){const b=document.getElementById('play');if(b)b.textContent=playing?'■ Стоп':'▶ Анимировать'}

// ---------- editor ----------
const toast=t=>{const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),2800)};
let open=new Set();
function inp(val,ph,on,cls=''){const i=document.createElement('input');i.type='text';i.value=val??'';i.placeholder=ph;i.setAttribute('enterkeyhint','done');if(cls)i.className=cls;i.oninput=()=>{on(i.value);changed()};return i}
function chipRow(obj,cur,on){const d=document.createElement('div');d.className='chips f';for(const k in obj){const b=document.createElement('button');b.className='chip'+(cur===k?' on':'');b.textContent=Array.isArray(obj[k])?obj[k][1]:obj[k];b.onclick=()=>{on(k);changed();render()};d.appendChild(b)}return d}
const sub=t=>{const d=document.createElement('div');d.className='sub';d.textContent=t;return d};
const row=(...els)=>{const d=document.createElement('div');d.className='row';els.forEach(e=>d.appendChild(e));return d};
let tmr=0;function changed(){save();clearTimeout(tmr);tmr=setTimeout(still,60)}
function render(){const box=document.getElementById('blocks');box.innerHTML='';
 cfg.blocks.forEach((b,i)=>{const el=document.createElement('div');el.className='blk'+(b.on?'':' off')+(open.has(i)?' open':'');
  const h=document.createElement('div');h.className='bh';const nm=document.createElement('div');nm.className='nm';nm.innerHTML=NAMES[b.t]+'<small></small>';
  nm.querySelector('small').textContent=b.t==='promo'?lines(b.title).join(' '):b.t==='plate'?b.title:b.t==='band'?b.text:open.has(i)?'свернуть':'нажми, чтобы менять';
  nm.onclick=()=>{open.has(i)?open.delete(i):open.add(i);render()};h.appendChild(nm);
  const btn=(t,f,dis)=>{const x=document.createElement('button');x.className='ib';x.textContent=t;x.disabled=!!dis;x.onclick=e=>{e.stopPropagation();f()};h.appendChild(x)};
  if(b.t!=='qr'){btn('↑',()=>{[cfg.blocks[i-1],cfg.blocks[i]]=[cfg.blocks[i],cfg.blocks[i-1]];open=new Set();changed();render()},i===0);
   btn('↓',()=>{[cfg.blocks[i+1],cfg.blocks[i]]=[cfg.blocks[i],cfg.blocks[i+1]];open=new Set();changed();render()},i>=cfg.blocks.length-2||cfg.blocks[i+1]?.t==='qr')}
  btn(b.on?'👁':'—',()=>{b.on=!b.on;changed();render()});
  if(!['logo','qr'].includes(b.t))btn('✕',()=>{if(confirmDel(b)){cfg.blocks.splice(i,1);open=new Set();changed();render()}});
  el.appendChild(h);const bb=document.createElement('div');bb.className='bb';editor(bb,b);el.appendChild(bb);box.appendChild(el)});
 const add=document.getElementById('addb');add.innerHTML='';for(const k in ADDN){const x=document.createElement('button');x.className='chip';x.textContent='+ '+ADDN[k];
  x.onclick=()=>{const qi=cfg.blocks.findIndex(b=>b.t==='qr');const at=qi<0?cfg.blocks.length:qi;cfg.blocks.splice(at,0,NEW[k]());open=new Set([at]);changed();render();toast('Блок добавлен, он над QR-кодами')};add.appendChild(x)}
 const an=document.getElementById('anim');an.replaceChildren(chipRow(ANIM,cfg.anim,k=>{cfg.anim=k;if(k!=='none')setTimeout(()=>play(),80)}));
 document.getElementById('dur').replaceChildren(chipRow(DUR,String(cfg.dur),k=>cfg.dur=+k))}
let delArm=null;function confirmDel(b){if(delArm===b)return true;delArm=b;toast('Нажми ✕ ещё раз, чтобы удалить');setTimeout(()=>{if(delArm===b)delArm=null},3000);return false}
function editor(bb,b){
 if(b.t==='logo')bb.appendChild(inp(b.sub,'Подпись под логотипом',v=>b.sub=v));
 if(b.t==='stats'){b.items.forEach((it,j)=>{bb.appendChild(sub('Карточка '+(j+1)));bb.appendChild(row(inp(it.v,'20',v=>it.v=v,'w1'),inp(it.s,'ПК в зале',v=>it.s=v,'w2')));
   bb.appendChild(chipRow(ICONS,it.ic,k=>it.ic=k));const hl=document.createElement('button');hl.className='chip'+(it.hl?' on':'');hl.textContent='Розовая рамка';hl.style.marginTop='8px';hl.onclick=()=>{it.hl=!it.hl;changed();render()};bb.appendChild(hl)});
  bb.appendChild(row(...[['+ Карточка',()=>{if(b.items.length<4)b.items.push({ic:'star',v:'24/7',s:'Без выходных'})}],['− Карточка',()=>{if(b.items.length>1)b.items.pop()}]].map(([t,f])=>{const x=document.createElement('button');x.className='add';x.style.marginTop=0;x.textContent=t;x.onclick=()=>{f();changed();render()};return x})))}
 if(b.t==='table'){bb.appendChild(sub('Колонки'));bb.appendChild(row(inp(b.c1,'STANDART',v=>b.c1=v),inp(b.c2,'VIP',v=>b.c2=v)));bb.appendChild(row(inp(b.s1,'RTX 4060',v=>b.s1=v),inp(b.s2,'RTX 4070',v=>b.s2=v)));
  b.rows.forEach((r,j)=>{bb.appendChild(sub(r.k==='h'?'Строка':r.k==='m'?'Утро (фиолетовая)':'Ночь (тёмная)'));const x=document.createElement('button');x.className='ib';x.textContent='✕';x.onclick=()=>{b.rows.splice(j,1);changed();render()};
   bb.appendChild(row(inp(r.n,'1 час',v=>r.n=v,'w2'),inp(r.a,'189',v=>r.a=v,'w1'),inp(r.b,'229',v=>r.b=v,'w1'),x));
   if(r.k!=='h')bb.appendChild(row(inp(r.s,'8:00-13:00',v=>r.s=v)))});
  bb.appendChild(sub('Добавить строку'));bb.appendChild(chipRow({h:'Обычная',m:'Фиолетовая',n:'Тёмная'},'',k=>{const r={k,n:k==='h'?'2 часа':k==='m'?'Утро':'Ночь',a:'0',b:'0'};if(k!=='h')r.s='00:00-00:00';
   if(k==='h'){const li=b.rows.map(x=>x.k).lastIndexOf('h');b.rows.splice(li+1,0,r)}else b.rows.push(r)}))}
 if(b.t==='plate'){bb.appendChild(inp(b.title,'Заголовок',v=>b.title=v));bb.appendChild(row(inp(b.sub,'Подпись',v=>b.sub=v)));bb.appendChild(row(inp(b.price,'Цена (пусто, если без цены)',v=>b.price=v,'w2'),inp(b.unit,'/h',v=>b.unit=v,'w1')));bb.appendChild(chipRow(ICONS,b.ic,k=>b.ic=k))}
 if(b.t==='promo'){bb.appendChild(inp(b.title,'Заголовок: Банка Gorilla / в подарок',v=>b.title=v));bb.appendChild(row(inp(b.text,'Условия: от *600₽*',v=>b.text=v)));
  bb.appendChild(sub('Картинка'));bb.appendChild(chipRow({gorilla:'Банка Gorilla',none:'Без картинки'},b.img,k=>b.img=k));bb.appendChild(sub('Цвет'));bb.appendChild(chipRow(COL,b.c,k=>b.c=k))}
 if(b.t==='band'){bb.appendChild(inp(b.text,'Текст полосы',v=>b.text=v));bb.appendChild(chipRow(COL,b.c,k=>b.c=k))}
 if(b.t==='qr'){bb.appendChild(row(inp(b.l1,'Под белым QR',v=>b.l1=v),inp(b.l2,'Над лаймовым QR',v=>b.l2=v)));const h=document.createElement('div');h.className='hint';h.textContent='Белый ведёт на канал, лаймовый в мини-апп. QR-коды всегда внизу.';bb.appendChild(h)}}
// Enter only hides the keyboard.
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();e.target.blur()}});

// ---------- sending ----------
async function post(body){const r=await fetch(FN,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({initData:tg?.initData||'',...body})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.error||r.status);return j}
async function busy(id,label,fn){const b=document.getElementById(id);if(b.disabled)return;if(!tg?.initData){toast('Открой конструктор из бота 1SHOT');return}b.disabled=true;const old=b.textContent;b.textContent=label;
 try{await fn(b)}catch(e){toast('Не вышло: '+(e.message||e))}b.disabled=false;b.textContent=old}
document.getElementById('sendPng').onclick=()=>busy('sendPng','Отправляю…',async()=>{still();await post({mode:'image',format:'price',png:cv.toDataURL('image/png').split(',')[1]});toast('Картинка в боте ✓');tg.HapticFeedback?.notificationOccurred('success')});
function pickMime(){if(!window.MediaRecorder)return null;for(const m of ['video/mp4;codecs=avc1.640028','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'])if(MediaRecorder.isTypeSupported?.(m))return m;return ''}
document.getElementById('sendVid').onclick=()=>busy('sendVid','Пишу видео…',async b=>{const mime=pickMime();if(mime===null||!cv.captureStream)throw new Error('этот телефон не умеет записывать видео, жми «На экран»');
 cancelAnimationFrame(raf);frame(0);const st=cv.captureStream(30);const rec=new MediaRecorder(st,mime?{mimeType:mime,videoBitsPerSecond:6e6}:{videoBitsPerSecond:6e6});const parts=[];rec.ondataavailable=e=>e.data.size&&parts.push(e.data);
 const done=new Promise(r=>rec.onstop=r);const D=cfg.dur||16;rec.start(500);const t0=performance.now();playing=1;
 await new Promise(res=>{const step=now=>{const t=(now-t0)/1000;frame(t);b.textContent=`Пишу видео… ${Math.max(0,Math.ceil(D-t))}`;if(t>=D){res();return}raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)});
 rec.stop();await done;st.getTracks().forEach(x=>x.stop());still();b.textContent='Отправляю…';
 const blob=new Blob(parts,{type:rec.mimeType||mime||'video/webm'});const fd=new FormData();fd.append('initData',tg.initData);fd.append('mode','video');fd.append('file',blob,'price');
 const r=await fetch(FN,{method:'POST',body:fd});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.error||r.status);toast(/mp4/.test(blob.type)?'Видео в боте ✓':'Видео в боте ✓ (формат WebM)');tg.HapticFeedback?.notificationOccurred('success')});
let screenSent=false;try{screenSent=!!localStorage.getItem('price_screen_sent')}catch{}
document.getElementById('toScr').onclick=()=>busy('toScr','Сохраняю…',async()=>{await post({mode:'screen',cfg,notify:!screenSent});try{localStorage.setItem('price_screen_sent','1')}catch{}
 toast(screenSent?'Экран обновится за пару минут ✓':'Ссылка для экрана в боте ✓');screenSent=true});
document.getElementById('play').onclick=()=>playing?still():play();
document.getElementById('reset').onclick=()=>{cfg=JSON.parse(JSON.stringify(DEFAULT));open=new Set();changed();render();toast('Прайс как на ресепшене')};

// ---------- start ----------
async function assets(){const [logo,can,q1,q2,sh]=await Promise.all(['../logo.svg','img/gorilla.png','img/qr_channel_logo.svg','img/qr_miniapp.svg','img/shape.svg'].map(loadImg));IMG={logo,can,q1,q2};
 if(sh){shapeC=mk(760,760);shapeC.getContext('2d').drawImage(sh,0,0,760,760)}
 await Promise.all(['900 40px UB','800 40px UB','500 40px UB','400 40px UB','500 27px RS','700 30px RS','700 40px RSN','700 20px JB'].map(f=>document.fonts.load(f,'АБВ abc 123 ₽')))}
async function access(){const t=document.getElementById('lockT');if(!tg?.initData){t.textContent='Доступ только для команды 1SHOT';return false}
 try{await post({mode:'check'});document.getElementById('lock').remove();return true}catch{}t.textContent='Доступ только для команды 1SHOT';return false}
async function screen(){document.body.classList.add('screen');let last='';
 const load=async()=>{try{const j=await (await fetch(FN+'?price=reception',{cache:'no-store'})).json();if(j?.cfg?.blocks){const s=JSON.stringify(j.cfg);if(s!==last){last=s;cfg=j.cfg;cache.clear();return true}}}catch{}return false};
 await load();await assets();let t0=performance.now(),tb0=t0;
 const step=now=>{frame((now-t0)/1000,(now-tb0)/1000);raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step);
 setInterval(async()=>{if(await load())t0=performance.now()},120000);setInterval(()=>{t0=performance.now()},300000);
 document.addEventListener('click',()=>document.documentElement.requestFullscreen?.().catch(()=>{}))}
(async()=>{if(SCREEN){screen();return}if(!await access())return;render();await assets();still();setTimeout(()=>play(),300)})();
