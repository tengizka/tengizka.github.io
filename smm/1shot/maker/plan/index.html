<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>1SHOT · план постов</title>
<meta name="robots" content="noindex">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../nav.js" data-cur="plan" data-root="../"></script>
<style>
@font-face{font-family:UB;src:url(../fonts/Unbounded.ttf);font-weight:200 900}
@font-face{font-family:JB;src:url(../fonts/jbm-cyr-700.woff2);unicode-range:U+0400-045F}
@font-face{font-family:JB;src:url(../fonts/jbm-lat-700.woff2);unicode-range:U+0000-00FF,U+2000-206F}
:root{--bg:#0B0B0C;--card:#16161A;--line:rgba(255,255,255,.12);--mut:rgba(255,255,255,.55);--lime:#A3FF10}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#fff;font:15px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 60px}h1{font:800 20px UB;margin:4px 0 14px}
.lab{font:700 11px JB;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:24px 0 8px}
.it{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px}
.it .t{font:700 13px JB;color:var(--lime);letter-spacing:.06em}.it .c{margin-top:4px;color:#ddd;font-size:14px;white-space:pre-line;max-height:4.2em;overflow:hidden}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.sm{border:1px solid var(--line);background:#0f0f12;color:#fff;border-radius:10px;padding:8px 12px;font:700 13px system-ui}
.sm.l{background:var(--lime);color:#000;border-color:var(--lime)}
input[type=datetime-local]{background:#0f0f12;border:1px solid var(--line);color:#fff;border-radius:10px;padding:8px 10px;font:14px system-ui;color-scheme:dark}
.pr{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:6px;color:#fff;font:600 15px system-ui;text-decoration:none}
.pr span{font:700 12px JB;color:var(--lime);width:44px;flex:none}.pr em{margin-left:auto;font-style:normal;color:var(--mut);font-size:12px}
.empty{color:var(--mut);font-size:14px}.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#fff;color:#000;border-radius:10px;padding:10px 14px;font-weight:700;opacity:0;transition:.2s;z-index:9}.toast.on{opacity:1}
</style></head><body>
<div id="lock" style="position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px"><div><img src="../logo.svg" alt="" style="width:160px;display:block;margin:0 auto"><div id="lockT" style="color:var(--mut);margin-top:10px">Проверяю доступ…</div></div></div>
<main>
<h1>План постов</h1>
<div class="lab">Запланировано</div><div id="sched"><div class="empty">Загружаю…</div></div>
<div class="lab">Готовые посты по датам</div><div class="empty" style="margin-bottom:6px">Нажми, пост откроется в конструкторе с подставленной датой. Там жми «⏰ Запланировать».</div><div id="presets"></div>
<div class="lab">Недавно вышло</div><div id="last"></div>
</main>
<div class="toast" id="toast"></div>
<script src="../presets.js"></script>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const FN='https://zqhfvtgktbfnxcclqqny.supabase.co/functions/v1/smm-maker';
const toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2400)};
const api=async b=>{const r=await fetch(FN,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({initData:tg?.initData||'',...b})});const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw new Error(j.error||r.status);return j};
const msk=iso=>{const d=new Date(new Date(iso).getTime()+3*3600e3).toISOString();return `${d.slice(8,10)}.${d.slice(5,7)} · ${d.slice(11,16)}`};
const plain=h=>String(h||'').replace(/<[^>]+>/g,'');
async function load(){const j=await api({mode:'plan'});const s=document.getElementById('sched');s.innerHTML='';
 if(!j.rows.length)s.innerHTML='<div class="empty">Пока ничего. Открой пост в конструкторе, выбери дату в «Когда опубликовать» и жми «⏰ Запланировать».</div>';
 for(const r of j.rows){const it=document.createElement('div');it.className='it';it.innerHTML='<div class="t"></div><div class="c"></div><div class="row"><input type="datetime-local"><button class="sm l">Перенести</button><button class="sm">Отменить</button></div>';
  it.querySelector('.t').textContent='⏰ '+msk(r.scheduled_at);it.querySelector('.c').textContent=plain(r.tg_caption)||r.title;
  const inp=it.querySelector('input');inp.value=new Date(new Date(r.scheduled_at).getTime()+3*3600e3).toISOString().slice(0,16);
  const [mv,cn]=it.querySelectorAll('button');
  mv.onclick=async()=>{try{await api({mode:'schedule',id:r.id,at:inp.value+':00+03:00'});toast('Перенесено ✓');load()}catch(e){toast('Не вышло: '+e.message)}};
  cn.onclick=async()=>{if(cn.dataset.arm!=='1'){cn.dataset.arm='1';cn.textContent='Точно отменить?';setTimeout(()=>{cn.dataset.arm='';cn.textContent='Отменить'},3000);return}
   try{await api({mode:'unschedule',id:r.id});toast('Отменено: пост остался в боте, опубликуешь кнопкой');load()}catch(e){toast('Не вышло: '+e.message)}};
  s.appendChild(it)}
 const l=document.getElementById('last');l.innerHTML=j.last.length?'':'<div class="empty">Пока пусто.</div>';
 for(const r of j.last){const it=document.createElement('div');it.className='it';it.innerHTML='<div class="t"></div><div class="c"></div>';it.querySelector('.t').textContent='✅ '+msk(r.published_at);it.querySelector('.c').textContent=plain(r.tg_caption);l.appendChild(it)}}
function presets(){const box=document.getElementById('presets');const now=new Date();
 PRESETS.forEach((p,i)=>{const [dd,mm]=p.d.split('.').map(Number);let d=new Date(now.getFullYear(),mm-1,dd,23,59);if(d<now&&now-d>60*864e5)d=new Date(now.getFullYear()+1,mm-1,dd);
  const past=d<now;const a=document.createElement('a');a.className='pr';a.href='../?preset='+i;a.innerHTML='<span></span><b></b><em></em>';a.querySelector('span').textContent=p.d;a.querySelector('b').textContent=p.n;a.querySelector('em').textContent=past?'прошёл':'';if(past)a.style.opacity=.45;box.appendChild(a)})}
(async()=>{const t=document.getElementById('lockT');if(!tg?.initData){t.textContent='Доступ только для команды 1SHOT';return}
 try{await api({mode:'check'});document.getElementById('lock').remove()}catch{t.textContent='Доступ только для команды 1SHOT';return}
 presets();load().catch(e=>{document.getElementById('sched').innerHTML='<div class="empty">Не загрузилось: '+e.message+'</div>'})})();
</script>
</body></html>
